spring:
  application:
    name: tieat-api
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tieat}
    username: ${DB_USERNAME:tieat}
    password: ${DB_PASSWORD:tieat_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

springdoc:
  paths-to-match: /api/**

tieat:
  receipts:
    provider: ${TIEAT_RECEIPTS_PROVIDER:local}
    local-root: ${TIEAT_RECEIPTS_LOCAL_ROOT:${java.io.tmpdir}/tieat-receipts-private}
    azure:
      endpoint: ${TIEAT_RECEIPTS_AZURE_ENDPOINT:}
      managed-identity-client-id: ${TIEAT_RECEIPTS_AZURE_MANAGED_IDENTITY_CLIENT_ID:}
      container: ${TIEAT_RECEIPTS_AZURE_CONTAINER:tieat-receipts-private}
      scan-timeout: ${TIEAT_RECEIPTS_AZURE_SCAN_TIMEOUT:PT30S}
      scan-poll-interval: ${TIEAT_RECEIPTS_AZURE_SCAN_POLL_INTERVAL:PT1S}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
