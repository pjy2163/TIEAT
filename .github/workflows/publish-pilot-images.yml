name: Publish pilot images

on:
  workflow_dispatch:
  push:
    branches: ['codex/cold-start-idle-savings']
    paths: ['.github/workflows/publish-pilot-images.yml']

permissions:
  contents: read

env:
  ACR_REGISTRY: tieatkpmnd7lh3fqv6.azurecr.io
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  api:
    if: github.ref == 'refs/heads/codex/cold-start-idle-savings'
    runs-on: ubuntu-latest
    environment: pilot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: ${{ env.ACR_REGISTRY }}/tieat-api:git-${{ github.sha }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_API_USERNAME }}
          password: ${{ secrets.ACR_API_PASSWORD }}

      - id: push
        run: |
          set -euo pipefail
          push_log="$(mktemp)"
          trap 'rm -f "$push_log"' EXIT
          docker push "${ACR_REGISTRY}/tieat-api:git-${GITHUB_SHA}" 2>&1 | tee "$push_log"
          digests=()
          mapfile -t digests < <(sed -nE 's/^([^[:space:]]+: )?digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\2/p' "$push_log")
          if [ "${#digests[@]}" -ne 1 ]; then
            echo "Expected exactly one SHA-256 digest in docker push output" >&2
            exit 1
          fi
          printf 'digest=%s\n' "${digests[0]}" >> "$GITHUB_OUTPUT"

      - if: success()
        run: echo "${ACR_REGISTRY}/tieat-api@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        run: |
          docker logout "${ACR_REGISTRY}" || true

  web:
    if: github.ref == 'refs/heads/codex/cold-start-idle-savings'
    runs-on: ubuntu-latest
    environment: pilot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: ${{ env.ACR_REGISTRY }}/tieat-web:git-${{ github.sha }}
          build-args: |
            TIEAT_API_ORIGIN=http://ca-tieat-api

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_WEB_USERNAME }}
          password: ${{ secrets.ACR_WEB_PASSWORD }}

      - id: push
        run: |
          set -euo pipefail
          push_log="$(mktemp)"
          trap 'rm -f "$push_log"' EXIT
          docker push "${ACR_REGISTRY}/tieat-web:git-${GITHUB_SHA}" 2>&1 | tee "$push_log"
          digests=()
          mapfile -t digests < <(sed -nE 's/^([^[:space:]]+: )?digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\2/p' "$push_log")
          if [ "${#digests[@]}" -ne 1 ]; then
            echo "Expected exactly one SHA-256 digest in docker push output" >&2
            exit 1
          fi
          printf 'digest=%s\n' "${digests[0]}" >> "$GITHUB_OUTPUT"

      - if: success()
        run: echo "${ACR_REGISTRY}/tieat-web@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        run: |
          docker logout "${ACR_REGISTRY}" || true
