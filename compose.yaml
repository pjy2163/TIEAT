services:
  api:
    image: tieat-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/tieat
      DB_USERNAME: tieat
      DB_PASSWORD: tieat_local
    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tieat
      POSTGRES_USER: tieat
      POSTGRES_PASSWORD: tieat_local
    ports:
      - target: 5432
        published: "5432"
        host_ip: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tieat -d tieat"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - tieat-postgres-data:/var/lib/postgresql

volumes:
  tieat-postgres-data:
