services:
  api:
    image: tieat-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tieat
      DB_USERNAME: tieat
      DB_PASSWORD: tieat_local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tieat
      POSTGRES_USER: tieat
      POSTGRES_PASSWORD: tieat_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tieat -d tieat"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - tieat-postgres-data:/var/lib/postgresql

volumes:
  tieat-postgres-data:
